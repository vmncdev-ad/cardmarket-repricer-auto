x-base: &base
  build: .
  image: cardmarket-repricer
  user: "${DOCKER_USER}"
  volumes:
    - ./data:/app/data

services:
  snapshot:
    <<: *base
  calc:
    <<: *base
    command: ["python", "calculator/calc.py"]
  exporter:
    build: ./exporter
    image: cardmarket-exporter
    user: "${DOCKER_USER}"
    volumes:
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  prometheus-data:
